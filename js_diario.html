<script>
/* =====================================================================
   Vista DIARIO: todos los registros del centro (o solo los míos), con
   filtros, búsqueda, detalle, edición/borrado y exportación a CSV.
   ===================================================================== */
let limiteDiario = 60;
VISTAS.diario = function(el) {
  limiteDiario = 60;
  el.innerHTML = cabeceraMovil() + '<header class="hero reveal"><div class="eyebrow">Diario de sesiones' + selectorCurso() + '</div><h1 class="h1">Lo que hemos <em>trabajado</em></h1></header>' + avisoCurso() + '<div class="dlay"><aside class="dside"><div id="cMes"></div><div id="cPend"></div></aside><div class="dmain"><div id="fBar"></div><div id="dList"></div></div></div>';
  enlazarCurso(el);
  pintarMes();
  // Sin refuerzos propios (p. ej. administración) no hay columna lateral.
  if (!$('#cMes').innerHTML) el.querySelector('.dlay').classList.add('sin-lado');
  const pintaBarra = () => { const fb = $('#fBar'); fb.innerHTML = ''; fb.appendChild(barraFiltros(full => { if (full) pintaBarra(); limiteDiario = 60; pintarDiario(); }, true)); };
  pintaBarra();
  pintarDiario();
};

/* ---------- Mi mes: calendario con un punto por día (rojo si falta anotar
   algún refuerzo, verde si está todo). Toca un día para ir a registrarlo. ---------- */
let mesCal = '';
function pintarMes() {
  const c = $('#cMes');
  if (!c) return;
  if (S.d.soloLectura || !S.actor || !S.d.horarios.some(h => h.docente_id === S.actor)) { c.innerHTML = ''; return; }
  const hoy = hoyIso();
  if (!mesCal) mesCal = hoy.slice(0, 7);
  const [y, m] = mesCal.split('-').map(Number);
  const rj = rejillaMes(mesCal), pend = rj.pend, ok = rj.ok;
  const prev = iso(new Date(y, m - 2, 1, 12)).slice(0, 7), next = iso(new Date(y, m, 1, 12)).slice(0, 7);
  c.innerHTML = '<section class="card cal reveal" aria-label="Mi mes"><div class="cal-h"><button class="arrow" data-mes="' + prev + '" aria-label="Mes anterior">' + IC.left + '</button>' +
    '<div class="grow"><b>' + MESES_L[m - 1].replace(/^./, x => x.toUpperCase()) + ' ' + y + '</b><small>' + (pend ? pend + (pend === 1 ? ' día por completar' : ' días por completar') : ok ? 'Todo anotado' : 'Sin refuerzos que anotar') + '</small></div>' +
    '<button class="arrow" data-mes="' + next + '" aria-label="Mes siguiente"' + (next > hoy.slice(0, 7) ? ' disabled' : '') + '>' + IC.right + '</button></div>' +
    rj.html +
    '<div class="cal-ley"><span><i class="e-pend"></i>Falta anotar</span><span><i class="e-ok"></i>Completo</span><span><i class="fest"></i>Festivo</span></div></section>';
  c.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { mesCal = b.dataset.mes; pintarMes(); });
  pintarPend();
  c.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => ir('registrar', { fecha: b.dataset.cal }));
}

/* Refuerzos ya pasados sin anotar en el mes visible, con acceso directo. */
let verPend = false;
function pintarPend() {
  const c = $('#cPend');
  if (!c) return;
  if (S.d.soloLectura || !S.actor || !S.d.horarios.some(h => h.docente_id === S.actor)) { c.innerHTML = ''; return; }
  const hoy = hoyIso(), mes = mesCal || hoy.slice(0, 7), ahora = ahoraMin(), lista = [];
  const [y, m] = mes.split('-').map(Number), ult = iso(new Date(y, m, 0, 12));
  for (let f = mes + '-01'; f <= ult && f <= hoy; f = sumaDias(f, 1)) {
    if (!enCurso(f)) continue;
    franjasDe(S.actor, f).forEach(fr => {
      const t = S.idx.tramo[fr.tramo_id] || {};
      if (f === hoy && minutos(t.hora_inicio) > ahora) return;
      if (!registrosDe(S.actor, f, fr.tramo_id).length) lista.push({ f, t, g: fr.grupo_ids });
    });
  }
  const regsMes = S.d.registros.filter(r => r.docente_id === S.actor && r.fecha.slice(0, 7) === mes);
  const v = hechas(regsMes).map(r => +r.aprovechamiento).filter(Boolean);
  const total = regsMes.length + lista.length;
  const kpi = (n, t) => '<div class="pk"><b class="num">' + n + '</b><small>' + t + '</small></div>';
  c.innerHTML = '<section class="card pendc reveal" aria-label="Pendientes"><div class="field-label"><span>Pendientes de anotar</span><span class="hint">' + lista.length + '</span></div>' +
    (lista.length ? '<div class="plist">' + lista.slice(0, verPend ? 99 : 3).map(x => '<button class="prow" data-pf="' + x.f + '" data-pt="' + esc(x.t.id || '') + '"><span class="grow"><b>' + esc(fechaCorta(x.f)) + ' · ' + esc(x.t.hora_inicio || '') + '</b><small>' + esc(nombreGrupo(x.g)) + '</small></span><span class="btn sm">Anotar</span></button>').join('') + '</div>' + (lista.length > 3 ? '<button class="linkbtn hint" id="verPend" style="margin:6px 0 0 10px;font-size:13px">' + (verPend ? 'Ver menos' : 'Ver los ' + lista.length) + '</button>' : '')
      : '<p class="muted" style="margin:4px 0 0;font-size:14px">Todo anotado este mes. 🎉</p>') +
    '<div class="pks">' + kpi(regsMes.length, 'sesiones') + kpi(total ? Math.round(regsMes.length * 100 / total) + '%' : '—', 'completado') + kpi(v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toLocaleString('es-ES', { maximumFractionDigits: 1 }) : '—', 'media ★') + '</div></section>';
  const vp = $('#verPend', c); if (vp) vp.onclick = () => { verPend = !verPend; pintarPend(); };
  c.querySelectorAll('[data-pf]').forEach(b => b.onclick = () => { ir('registrar', { fecha: b.dataset.pf }); if (b.dataset.pt) cambiarTramo(b.dataset.pt); });
}

function pintarDiario() {
  const c = $('#dList');
  const regs = filtrar(S.d.registros);
  if (!regs.length) {
    c.innerHTML = '<div class="empty">' + artVacio() + '<h2 class="h2">' + (S.d.registros.length ? 'Nada con estos filtros' : 'Aún no hay sesiones') + '</h2><p>' + (S.d.registros.length ? 'Prueba a ampliar el periodo o limpiar los filtros.' : 'Las sesiones que registréis aparecerán aquí.') + '</p></div>';
    return;
  }
  const nAlu = new Set(); hechas(regs).forEach(r => aluIds(r).forEach(i => nAlu.add(i)));
  const nNo = regs.length - hechas(regs).length;
  let h = '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap"><span class="muted num" style="font-size:13.5px">' + regs.length + (regs.length === 1 ? ' sesión' : ' sesiones') + ' · ' + nAlu.size + ' alumnos/as' + (nNo ? ' · ' + nNo + ' no realizadas' : '') + '</span>' +
    '<button class="btn sm" id="csv">' + IC.down + 'Exportar CSV</button></div>';
  const porFecha = {};
  const vis = regs.slice(0, limiteDiario);
  vis.forEach(r => (porFecha[r.fecha] = porFecha[r.fecha] || []).push(r));
  Object.keys(porFecha).sort().reverse().forEach(f => {
    h += '<section class="daygroup"><h3>' + esc(fechaLarga(f)) + '<small>' + esc(relativa(f) !== fechaCorta(f) ? relativa(f) : '') + '</small></h3><div class="entries">' + porFecha[f].map(tarjetaRegistro).join('') + '</div></section>';
  });
  if (regs.length > limiteDiario) h += '<div style="text-align:center;margin-top:20px"><button class="btn" id="mas">Ver más (' + (regs.length - limiteDiario) + ')</button></div>';
  c.innerHTML = h;
  c.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => detalleRegistro(b.dataset.reg));
  $('#csv').onclick = () => exportarCSV(regs);
  const m = $('#mas'); if (m) m.onclick = () => { limiteDiario += 100; pintarDiario(); };
}

function tarjetaRegistro(r) {
  const t = S.idx.tramo[r.tramo_id];
  if (noHecha(r)) return '<button class="entry no" data-reg="' + esc(r.id) + '"><div class="who">No realizada · ' + esc(r.motivo || '—') + '</div>' +
    '<div class="meta"><span>' + esc(nombreGrupo(r.grupo_id)) + '</span><span class="num">' + esc(t ? t.hora_inicio : '') + '</span><span>' + esc(nombreDocId(r.docente_id)) + '</span>' + (aluIds(r).length ? '<span>' + esc(aluIds(r).map(nombreAlu).join(', ')) + '</span>' : '') + '</div>' +
    (r.trabajado ? '<p>' + esc(r.trabajado) + '</p>' : '') + '</button>';
  return '<button class="entry" data-reg="' + esc(r.id) + '" style="--c:' + colorMateria(r.materia) + '">' +
    '<div class="who">' + esc(esGran(r) ? 'Gran grupo' : aluIds(r).map(nombreAlu).join(', ') || r.alumnos_txt) + '</div>' +
    '<div class="meta">' + (r._pend ? '<span class="pend">Guardando…</span>' : '') + '<span class="tag" style="--c:' + colorMateria(r.materia) + '">' + esc(r.materia || '—') + '</span>' + miniEstrellas(+r.aprovechamiento) +
    '<span>' + esc(nombreGrupo(r.grupo_id)) + '</span><span class="num">' + esc(t ? t.hora_inicio : '') + '</span><span>' + esc(nombreDocId(r.docente_id)) + '</span></div>' +
    (r.trabajado ? '<p>' + esc(r.trabajado) + '</p>' : '') + '</button>';
}

function detalleRegistro(id) {
  const r = S.d.registros.find(x => x.id === id);
  if (!r) return;
  const t = S.idx.tramo[r.tramo_id];
  const inn = abrirHoja(cabHoja(esc(fechaLarga(r.fecha)), esc(etiquetaTramo(t) + ' · ' + nombreGrupo(r.grupo_id) + ' · ' + nombreDocId(r.docente_id))) +
    '<div class="stack"><div class="pills">' + aluIds(r).sort((a, b) => ordenGrupo((S.idx.alu[a] || {}).grupo_id) - ordenGrupo((S.idx.alu[b] || {}).grupo_id)).map(i => '<button class="pill sm" data-ficha="' + esc(i) + '" title="' + esc(nombreAlu(i)) + '">' + esc(S.idx.alu[i] ? nombrePildora(nombreAlu(i)) : nombreAlu(i)) + '</button>').join('') + '</div>' +
    (noHecha(r) ? '<div class="banner warn">' + IC.info + '<span class="grow">Sesión no realizada · <b>' + esc(r.motivo) + '</b></span></div>' :
    '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span class="tag" style="--c:' + colorMateria(r.materia) + ';font-size:14px">' + esc(r.materia || '—') + '</span>' + miniEstrellas(+r.aprovechamiento) + '<span class="muted" style="font-size:13.5px">' + esc(NIVELES[+r.aprovechamiento] || 'Sin valorar') + '</span></div>') +
    '<p style="white-space:pre-line;margin:0;font-size:16px;line-height:1.6">' + (r.trabajado ? esc(r.trabajado) : '<span class="muted">Sin descripción.</span>') + '</p>' +
    '<p class="muted" style="font-size:12px;margin:0">Registrado ' + esc(String(r.creado || '').replace('T', ' ').slice(0, 16)) + porSustituto(r) + (r.actualizado && r.actualizado !== r.creado ? ' · editado ' + esc(String(r.actualizado).replace('T', ' ').slice(0, 16)) : '') + '</p></div>' +
    (r._pend ? '<p class="muted" style="font-size:13px;margin:16px 0 0">Guardándose en la hoja… En un momento podrás editarlo o borrarlo.</p>' : puedoEditar(r) ? '<div class="sheet-foot"><button class="btn danger" id="del">Borrar</button><button class="btn primary" id="edit">' + IC.edit + 'Editar</button></div>' : ''));
  inn.querySelectorAll('[data-ficha]').forEach(b => b.onclick = () => fichaAlumno(b.dataset.ficha));
  const e = $('#edit', inn);
  if (e) e.onclick = () => { cerrarHoja(); ir('registrar', { editar: r }); };
  const d = $('#del', inn);
  if (d) d.onclick = async () => {
    if (!(await confirmar('Se borrará este registro de forma permanente.', 'Borrar'))) return;
    hacer('borrarRegistro', [r.id], 'Registro borrado');
    if (S.view !== 'diario') ir(S.view, { keepScroll: true });
  };
}

/* Si lo anotó el sustituto/a (entra con su email y actúa como el titular). */
function porSustituto(r) {
  const m = String(r.docente_txt || '').match(/\(sust\.: (.+)\)$/);
  return m ? ' por ' + esc(m[1]) + ' (sustitución)' : '';
}

function exportarCSV(regs) {
  const cab = ['Fecha', 'Día', 'Tramo', 'Docente', 'Grupo', 'Alumnado', 'Estado', 'Motivo', 'Materia', 'Aprovechamiento', 'Trabajado'];
  // Comilla delante de = + - @ para que Excel/Sheets no lo ejecuten como fórmula.
  const q = v => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const filas = regs.map(r => [r.fecha, DIA_LARGO[diaDe(r.fecha)] || '', etiquetaTramo(S.idx.tramo[r.tramo_id]), nombreDocId(r.docente_id), nombreGrupo(r.grupo_id), (esGran(r) ? 'Gran grupo' : aluIds(r).map(nombreAlu).join(', ')), noHecha(r) ? 'No realizada' : 'Realizada', r.motivo || '', r.materia, noHecha(r) ? '' : r.aprovechamiento, r.trabajado].map(q).join(';'));
  const blob = new Blob(['﻿' + cab.map(q).join(';') + '\n' + filas.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'refuerzos-' + hoyIso() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
</script>
